<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TourNeat</title>
<style>
html,body{margin:0;height:100%;background:#F5F5F7;color:#1D1D1F;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.nf{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.nf div{background:#fff;border-radius:18px;padding:28px 30px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.nf h1{margin:0 0 6px;font-size:22px}.nf p{margin:0 0 14px;color:#6E6E73}
.nf a{display:inline-block;background:#1D1D1F;color:#fff;text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:600}
</style>
</head><body>
<script>
/* tourneat.com/app/<codice del cliente>: apre l'app (stessa pagina di /app/), l'indirizzo resta quello pulito */
(function(){
  if(/^\/crm(\/|$)/i.test(location.pathname)){location.replace('/admin/');return;}
  if(/^\/app\/[a-z0-9_-]{2,40}\/?$/i.test(location.pathname)){
    fetch('/app/index.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text();})
      .then(function(h){document.open();document.write(h);document.close();})
      .catch(function(){nf('Non riesco ad aprire l’app. Controlla la connessione e riprova.');});
    return;
  }
  nf('Questa pagina non esiste.');
  function nf(t){document.body.innerHTML='<div class="nf"><div><h1>TourNeat</h1><p>'+t+'</p><a href="/">Vai a tourneat.com</a></div></div>';}
})();
</script>
</body></html>
